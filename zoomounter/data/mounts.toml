# Mount catalogue. Loaded and validated by zoomounter/catalogue.py.
#
# bolt_pattern.type carries design INTENT, not just coordinates. A NEMA
# faceplate is dimensioned as a SQUARE spacing between hole centres, not a
# bolt-circle diameter; feeding one to the other puts the holes at the edge
# midpoints instead of the corners -- 6.4mm out on every hole for a NEMA 17,
# and the plate will not bolt on. ZooMounter shipped exactly that bug. Keep
# the type honest and the loader expands it correctly.

# A radial rating is a MOMENT limit wearing a force's clothes. It is quoted
# at a stated distance from the mounting flange, because what it protects is
# the motor's front bearing, and a side load's severity there scales with how
# far out it acts. A rating whose distance did not travel with it cannot be
# compared to a load case at all -- 28N at 15mm and 28N at 20mm are different
# demands on the same bearing. max_radial_at_mm is therefore mandatory
# alongside max_radial_n; the loader rejects one without the other.
#
# Axial needs no such field. Thrust along the shaft axis produces the same
# demand wherever it is applied from, so the figure stands alone.

# M3 fasteners. 3.4mm is ISO 273 "normal" clearance -- a 3.0mm hole would
# be an interference fit on an M3 screw, not a clearance hole.
[[mount]]
key                  = "nema17"
name                 = "NEMA 17 stepper motor mount"
kind                 = "motor"
plate_width_mm       = 42.3
plate_height_mm      = 42.3
bolt_hole_dia_mm     = 3.4
center_hole_dia_mm   = 22
shaft_dia_mm         = 5
typical_mass_kg      = 0.28
body_cg_offset_mm    = 20
max_axial_n          = 10
max_radial_n         = 28
max_radial_at_mm     = 20
load_limit_source    = "ATO NEMA 17 (42mm) datasheet: Axial Max. Load 10N, Radial Max. Load 28N. Measurement distance from JK42HSxx-series datasheet (Jkong Motor), which publishes the same 28N as 'Max. radial force 28N (20mm from the flange)'."

[mount.bolt_pattern]
type = "square"
spacing_mm = 31

# CONTESTED FIGURE -- read before changing max_axial_n.
#
# Two reputable vendors publish the numeral "15" for NEMA 23 axial load in
# DIFFERENT UNITS, a 4.45x disagreement:
#   ATO NEMA 23 (56mm) datasheet ....... Axial Max. Load  15 N
#   Same Sky NEMA23-AMT112S datasheet .. max axial load   15 lb (66.7 N)
#
# We take the conservative 15 N. An earlier revision hardcoded 67 N for
# every motor, which is the Same Sky figure with the unit assumed -- exactly
# how the NEMA bolt-pattern bug happened.
#
# RESOLVED FURTHER: the 57HS-series NEMA 23 datasheet independently publishes
# "Max. axial force 15N" and "Max. radial force 75N (20mm from the flange)",
# matching ATO on both figures. Two unrelated manufacturers now agree on 15 N,
# against one on 15 lb, so the conservative reading is no longer a tie-break
# on a single source.
[[mount]]
key                  = "nema23"
name                 = "NEMA 23 stepper motor mount"
kind                 = "motor"
plate_width_mm       = 56.4
plate_height_mm      = 56.4
bolt_hole_dia_mm     = 5.5
center_hole_dia_mm   = 38.1
shaft_dia_mm         = 8
typical_mass_kg      = 0.7
body_cg_offset_mm    = 28
max_axial_n          = 15
max_radial_n         = 75
max_radial_at_mm     = 20
load_limit_source    = "ATO NEMA 23 (56mm) datasheet: Axial Max. Load 15N, Radial Max. Load 75N, corroborated by the 57HS-series datasheet ('Max. axial force 15N', 'Max. radial force 75N (20mm from the flange)'), which also supplies the measurement distance. Contested: Same Sky NEMA23-AMT112S publishes 15 lb = 66.7N axial."

[mount.bolt_pattern]
type = "square"
spacing_mm = 47.14

# v1 models the centre feature as a plain through-bore at the bearing OD.
# A real pillow block needs a shouldered pocket to capture the bearing.
[[mount]]
key                  = "bearing_608"
name                 = "608 bearing (skate bearing) pillow mount"
kind                 = "bearing"
plate_width_mm       = 40
plate_height_mm      = 40
bolt_hole_dia_mm     = 3.4
center_hole_dia_mm   = 22
shaft_dia_mm         = 8

[mount.bolt_pattern]
type = "circular"
count = 4
circle_dia_mm = 34

# REMOVED: raspberry_pi and vesa_75.
#
# ZooMounter's scope is parts governed by a SHAFT load -- motors, bearing
# housings, idlers, tensioners. Neither removed row was such a part, and
# carrying them made the tool answer questions it had no model for:
#
#   - A Pi carries no shaft load at all. What actually governs a board mount
#     is standoff height, connector clearance and airflow, none of which this
#     tool computes. HANDOFF listed electronics mounts as explicitly CUT while
#     this row kept shipping, so the catalogue contradicted the decision.
#   - A VESA bracket IS load-bearing, but as a cantilever carrying the screen's
#     own mass -- there is no axis and nothing rotates, so "radial" is a
#     category error for it. Worse, the row published neither typical_mass_kg
#     nor shaft_load_offset_mm, so the loader's defaults sized a monitor
#     bracket as though the screen weighed nothing and the load acted 15mm off
#     the face. The single number that dominates the real case was absent and a
#     fabricated shaft offset stood in for it.
#
# Both were generating confident output for load paths that did not exist.
# Declining to model them is the honest result; see RULES.md on applies_to.
